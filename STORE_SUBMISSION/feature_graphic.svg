<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <!-- Accent gradient for phone glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0"/>
    </radialGradient>
    <!-- Phone screen gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C2E"/>
      <stop offset="100%" style="stop-color:#12121F"/>
    </linearGradient>
    <!-- Clip for phone screen -->
    <clipPath id="screenClip">
      <rect x="648" y="62" width="208" height="378" rx="14"/>
    </clipPath>
    <!-- Drop shadow filter -->
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="1024" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1024" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1024" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="1024" y2="400" stroke="white" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="500" stroke="white" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="500" stroke="white" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="500" stroke="white" stroke-width="1"/>
    <line x1="512" y1="0" x2="512" y2="500" stroke="white" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="500" stroke="white" stroke-width="1"/>
    <line x1="768" y1="0" x2="768" y2="500" stroke="white" stroke-width="1"/>
    <line x1="896" y1="0" x2="896" y2="500" stroke="white" stroke-width="1"/>
  </g>

  <!-- Glow behind phone -->
  <ellipse cx="752" cy="250" rx="180" ry="220" fill="url(#glowGrad)"/>

  <!-- ===== PHONE MOCKUP ===== -->
  <g filter="url(#phoneShadow)">
    <!-- Phone body -->
    <rect x="636" y="44" width="232" height="412" rx="28" fill="#1E1E2E" stroke="#3A3A5C" stroke-width="2"/>
    <!-- Screen area -->
    <rect x="648" y="62" width="208" height="378" rx="14" fill="url(#screenGrad)"/>
    <!-- Notch -->
    <rect x="716" y="62" width="72" height="24" rx="0" fill="#1E1E2E"/>
    <rect x="726" y="68" width="52" height="12" rx="6" fill="#12121F"/>
    <!-- Camera dot -->
    <circle cx="768" cy="74" r="4" fill="#2A2A3E"/>
    <circle cx="768" cy="74" r="2" fill="#1A1A2E"/>
    <!-- Home bar -->
    <rect x="706" y="432" width="92" height="4" rx="2" fill="#3A3A5C"/>
    <!-- Side buttons -->
    <rect x="634" y="120" width="4" height="40" rx="2" fill="#2A2A3E"/>
    <rect x="634" y="170" width="4" height="40" rx="2" fill="#2A2A3E"/>
    <rect x="866" y="140" width="4" height="60" rx="2" fill="#2A2A3E"/>
  </g>

  <!-- ===== PHONE SCREEN CONTENT ===== -->
  <g clip-path="url(#screenClip)">
    <!-- Status bar -->
    <rect x="648" y="62" width="208" height="20" fill="#12121F"/>
    <text x="660" y="76" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#888" font-weight="500">9:41</text>
    <text x="836" y="76" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#888" text-anchor="end">100%</text>

    <!-- App header -->
    <rect x="648" y="82" width="208" height="36" fill="#1A1A2E"/>
    <text x="752" y="104" font-family="SF Pro, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">TickTack</text>
    <!-- Menu icon dots -->
    <circle cx="834" cy="100" r="2" fill="#888"/>
    <circle cx="840" cy="100" r="2" fill="#888"/>
    <circle cx="846" cy="100" r="2" fill="#888"/>

    <!-- Tabs -->
    <rect x="648" y="118" width="208" height="28" fill="#12121F"/>
    <rect x="656" y="121" width="44" height="22" rx="11" fill="#4F46E5"/>
    <text x="678" y="135" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="white" text-anchor="middle">Все</text>
    <text x="722" y="135" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#666" text-anchor="middle">Личное</text>
    <text x="770" y="135" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#666" text-anchor="middle">Работа</text>
    <text x="818" y="135" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#666" text-anchor="middle">🔒</text>

    <!-- Task items -->
    <!-- Task 1 -->
    <rect x="652" y="152" width="200" height="44" rx="10" fill="#1E1E35"/>
    <circle cx="672" cy="174" r="9" fill="none" stroke="#4F46E5" stroke-width="2"/>
    <text x="686" y="170" font-family="SF Pro, -apple-system, sans-serif" font-size="10" font-weight="600" fill="white">Купить молоко</text>
    <text x="686" y="183" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#666">Сегодня, 18:00</text>
    <rect x="822" y="168" width="22" height="12" rx="6" fill="#FF6B6B" opacity="0.8"/>
    <text x="833" y="177" font-family="SF Pro, -apple-system, sans-serif" font-size="7" fill="white" text-anchor="middle" font-weight="600">!</text>

    <!-- Task 2 -->
    <rect x="652" y="200" width="200" height="44" rx="10" fill="#1E1E35"/>
    <!-- Completed check -->
    <circle cx="672" cy="222" r="9" fill="#4F46E5"/>
    <path d="M666 222 L670 227 L678 217" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="686" y="218" font-family="SF Pro, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#555" text-decoration="line-through">Отчёт за квартал</text>
    <text x="686" y="231" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#444">Вчера, 17:00</text>

    <!-- Task 3 (location) -->
    <rect x="652" y="248" width="200" height="44" rx="10" fill="#1E1E35"/>
    <circle cx="672" cy="270" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <text x="686" y="266" font-family="SF Pro, -apple-system, sans-serif" font-size="10" font-weight="600" fill="white">Зайти в аптеку</text>
    <!-- Location chip -->
    <rect x="686" y="271" width="52" height="11" rx="5.5" fill="#0E4C57"/>
    <text x="712" y="279" font-family="SF Pro, -apple-system, sans-serif" font-size="7" fill="#22D3EE" text-anchor="middle">📍 500м</text>

    <!-- Task 4 -->
    <rect x="652" y="296" width="200" height="44" rx="10" fill="#1E1E35"/>
    <circle cx="672" cy="318" r="9" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="686" y="314" font-family="SF Pro, -apple-system, sans-serif" font-size="10" font-weight="600" fill="white">Созвон с командой</text>
    <text x="686" y="327" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#666">Завтра, 11:00</text>
    <rect x="822" y="312" width="22" height="12" rx="6" fill="#F59E0B" opacity="0.8"/>
    <text x="833" y="321" font-family="SF Pro, -apple-system, sans-serif" font-size="7" fill="white" text-anchor="middle" font-weight="600">~</text>

    <!-- Task 5 -->
    <rect x="652" y="344" width="200" height="44" rx="10" fill="#1E1E35" opacity="0.6"/>
    <circle cx="672" cy="366" r="9" fill="none" stroke="#666" stroke-width="2"/>
    <text x="686" y="362" font-family="SF Pro, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#888">Прочитать книгу</text>
    <text x="686" y="375" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#555">Пт, 20:00</text>

    <!-- FAB button -->
    <circle cx="828" cy="410" r="20" fill="#4F46E5"/>
    <text x="828" y="416" font-family="SF Pro, -apple-system, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="300">+</text>
  </g>

  <!-- ===== LEFT SIDE: LOGO + TEXT ===== -->

  <!-- App Icon -->
  <g filter="url(#iconShadow)">
    <rect x="60" y="60" width="96" height="96" rx="22" fill="#111111"/>
    <!-- TickTack logo - two vertical bars with horizontal element -->
    <!-- Left bar -->
    <rect x="83" y="82" width="18" height="52" rx="2" fill="white"/>
    <!-- Right bar (shorter) -->
    <rect x="112" y="96" width="18" height="38" rx="2" fill="white"/>
    <!-- Top cap on left bar -->
    <rect x="78" y="80" width="28" height="8" rx="2" fill="white"/>
    <!-- Top cap on right bar -->
    <rect x="107" y="94" width="28" height="8" rx="2" fill="white"/>
  </g>

  <!-- App name -->
  <text x="60" y="208" font-family="SF Pro Display, -apple-system, sans-serif" font-size="56" font-weight="800" fill="white" letter-spacing="-2">TickTack</text>

  <!-- Tagline -->
  <text x="60" y="244" font-family="SF Pro, -apple-system, sans-serif" font-size="18" fill="#888" letter-spacing="0.5">Умные напоминания для жизни</text>

  <!-- Divider line -->
  <line x1="60" y1="270" x2="280" y2="270" stroke="#2A2A4A" stroke-width="1"/>

  <!-- Features list -->
  <!-- Feature 1 -->
  <g transform="translate(60, 292)">
    <circle cx="10" cy="10" r="10" fill="#4F46E5" opacity="0.2"/>
    <text x="10" y="14" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="#4F46E5" text-anchor="middle">⏰</text>
    <text x="30" y="14" font-family="SF Pro, -apple-system, sans-serif" font-size="14" fill="#CCCCCC">Напоминания по времени и GPS</text>
  </g>

  <!-- Feature 2 -->
  <g transform="translate(60, 322)">
    <circle cx="10" cy="10" r="10" fill="#22D3EE" opacity="0.2"/>
    <text x="10" y="14" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="#22D3EE" text-anchor="middle">📍</text>
    <text x="30" y="14" font-family="SF Pro, -apple-system, sans-serif" font-size="14" fill="#CCCCCC">Геолокация — задача у нужного места</text>
  </g>

  <!-- Feature 3 -->
  <g transform="translate(60, 352)">
    <circle cx="10" cy="10" r="10" fill="#F59E0B" opacity="0.2"/>
    <text x="10" y="14" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="#F59E0B" text-anchor="middle">🔒</text>
    <text x="30" y="14" font-family="SF Pro, -apple-system, sans-serif" font-size="14" fill="#CCCCCC">Приватные списки — Face ID / отпечаток</text>
  </g>

  <!-- Feature 4 -->
  <g transform="translate(60, 382)">
    <circle cx="10" cy="10" r="10" fill="#34D399" opacity="0.2"/>
    <text x="10" y="14" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="#34D399" text-anchor="middle">✓</text>
    <text x="30" y="14" font-family="SF Pro, -apple-system, sans-serif" font-size="14" fill="#CCCCCC">Подзадачи, приоритеты, статистика</text>
  </g>

  <!-- Feature 5 -->
  <g transform="translate(60, 412)">
    <circle cx="10" cy="10" r="10" fill="#A78BFA" opacity="0.2"/>
    <text x="10" y="14" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="#A78BFA" text-anchor="middle">🌙</text>
    <text x="30" y="14" font-family="SF Pro, -apple-system, sans-serif" font-size="14" fill="#CCCCCC">Тёмная тема · Бесплатно</text>
  </g>

  <!-- Decorative accent line on left edge -->
  <rect x="0" y="0" width="4" height="500" fill="url(#accentLine)"/>
  <defs>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#4F46E5;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#22D3EE;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Floating dots decoration -->
  <circle cx="520" cy="80" r="3" fill="#4F46E5" opacity="0.5"/>
  <circle cx="540" cy="120" r="2" fill="#22D3EE" opacity="0.4"/>
  <circle cx="510" cy="160" r="4" fill="#4F46E5" opacity="0.3"/>
  <circle cx="555" cy="200" r="2" fill="#A78BFA" opacity="0.5"/>
  <circle cx="525" cy="340" r="3" fill="#22D3EE" opacity="0.3"/>
  <circle cx="545" cy="380" r="2" fill="#4F46E5" opacity="0.4"/>
  <circle cx="515" cy="420" r="4" fill="#A78BFA" opacity="0.3"/>
  <circle cx="560" cy="440" r="2" fill="#22D3EE" opacity="0.5"/>
</svg>
